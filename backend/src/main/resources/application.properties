# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/financetrack?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.secret=${JWT_SECRET:FinanceTrack2024SuperSecretKeyForJWTTokenGenerationAtLeast256Bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS (allow frontend URL)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.financetrack=INFO
logging.level.org.springframework.security=WARN

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
