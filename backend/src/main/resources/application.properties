# Server
server.port=${PORT:8080}

# Database — supports both MySQL (local) and PostgreSQL (Render)
# Set DATABASE_URL as full JDBC URL in environment, e.g.:
#   MySQL:      jdbc:mysql://localhost:3306/financetrack?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
#   PostgreSQL: jdbc:postgresql://<host>:5432/<dbname>
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/financetrack?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

# Auto-detect driver from URL
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate — let Hibernate auto-detect dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection pool tuning for free tier
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Lazy init to speed up cold starts
spring.main.lazy-initialization=true
# Hibernate will auto-select dialect based on the driver

# JWT
jwt.secret=${JWT_SECRET:FinanceTrack2024SuperSecretKeyForJWTTokenGenerationAtLeast256Bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging
logging.level.com.financetrack=INFO
logging.level.org.springframework.security=WARN
